[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerodrift"
version = "0.1.0"
description = "Agentic Cloud Topology & Remediation Graph"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "networkx>=3.2",
    "rich>=13.7",
]

[tool.setuptools.packages.find]
where = ["src"]